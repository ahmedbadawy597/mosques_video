services:
  mosques-portfolio:
    build: .
    container_name: mosques-portfolio
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=mosques-portfolio.strategizeit.us
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=mosques-portfolio.strategizeit.us
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ecm_ecm-net
